name: ལས་འགན། / Content Task
description: ནང་དོན་ལས་ཀ་གསར་པ་ཞིག་དང་དེའི་ལས་ཀའི་རིམ་པ་ S1–T3 ཁག་བཀོད་པ། / New content task tracked through the S1–T3 pipeline
title: "[Task]: "
labels: ["content", "triage"]
projects: ["WeBuddhist/15"]
body:
  - type: markdown
    attributes:
      value: |
        ### ལས་འགན་གསར་པ།
        ལས་ཀ་འདི་ **ལས་ཀའི་རིམ་པ་ S1 ནས་ T3** བར་གང་དུ་སླེབས་ཡོད་མཚོན་རོགས།

  - type: input
    id: task-name
    attributes:
      label: ལས་ཀའི་མིང་། / Task name
      description: ལས་ཀ་འདིའི་མཚན་བྱང་ཐུང་ངུ་། (དཔེར་ན་ རྩ་བའི་མིང་) / Short title (e.g. the text name)
      placeholder: དཔེར་ན། ཤེར་སྙིང་ (Heart Sūtra)
    validations:
      required: true

  - type: dropdown
    id: current-stage
    attributes:
      label: ད་ལྟའི་ལས་རིམ། / Current stage
      description: ལས་ཀ་འདི་ད་ལྟ་རིམ་པ་གང་དུ་སླེབས་ཡོད། (board ཀྱི་ Status དང་མཐུན) / Which stage is this at now (matches the board Status)
      options:
        - "S1 — Raw Sources / རྩ་བའི་འབྱུང་ཁུངས།"
        - "S2 — Markups / རྟགས་འགོད།"
        - "S3 — Links / སྦྲེལ་མཐུད།"
        - "R1 — Multi-level Summaries / རིམ་པ་མང་བའི་སྙིང་བསྡུས།"
        - "R2 — Segments / དུམ་བུ།"
        - "R3 — Keywords / གནད་ཚིག"
        - "T1 — Translations & Adaptations / ཡིག་སྒྱུར་དང་བསྒྱུར་བཅོས།"
        - "T2 — Plans / འཆར་གཞི།"
        - "T3 — Courses / སློབ་ཚན།"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### ལས་ཀའི་རིམ་པ་ཁག / Work stages
        རིམ་པ་རེ་རེའི་ནང་གི་བྱ་བ་ཚང་དུས་བརྟགས (✓) རྒྱག་རོགས།

  - type: checkboxes
    id: s1-raw-sources
    attributes:
      label: S1 — Raw Sources / རྩ་བའི་འབྱུང་ཁུངས།
      options:
        - label: "Texts — རྩ་བ་དང་འགྲེལ་བ། (root & commentaries)"
        - label: "Audios — སྒྲ།"
        - label: "Videos — བརྙན།"

  - type: checkboxes
    id: s2-markups
    attributes:
      label: S2 — Markups / རྟགས་འགོད།
      options:
        - label: "Add TOC — དཀར་ཆག / ས་བཅད་བཀོད་པ།"
        - label: "Chunk IDs — དུམ་བུའི་ID བཀོད་པ།"
        - label: "Yikchung — ཡིག་ཆུང་།"
        - label: "Citations — ལུང་འདྲེན།"

  - type: checkboxes
    id: s3-links
    attributes:
      label: S3 — Links / སྦྲེལ་མཐུད།
      options:
        - label: "Align translation — ཡིག་སྒྱུར་སྒྲིག་སྦྱོར།"
        - label: "Commentaries — འགྲེལ་བ་སྦྲེལ་བ།"
        - label: "Link citation sources — ལུང་འདྲེན་གྱི་འབྱུང་ཁུངས་སྦྲེལ་བ།"

  - type: checkboxes
    id: r1-summaries
    attributes:
      label: R1 — Multi-level Summaries / རིམ་པ་མང་བའི་སྙིང་བསྡུས།
      options:
        - label: "One multi-level summary — རིམ་པ་མང་བའི་སྙིང་བསྡུས་གཅིག"
        - label: "Claim list per TOC — དཀར་ཆག་རེ་རེའི་འདོད་ཚིག་ཐོ།"

  - type: checkboxes
    id: r2-segments
    attributes:
      label: R2 — Segments / དུམ་བུ།
      options:
        - label: "One authoritative interpretation file per segment — དུམ་བུ་རེ་རེར་ཚད་ལྡན་གྱི་འགྲེལ་བཤད་ཡིག་ཆ་གཅིག"

  - type: checkboxes
    id: r3-keywords
    attributes:
      label: R3 — Keywords / གནད་ཚིག
      options:
        - label: "1 local wiki article per keyword — གནད་ཚིག་རེ་རེར་ས་གནས་ཝི་ཀི་རྩོམ་ཡིག་གཅིག"

  - type: checkboxes
    id: t1-translations
    attributes:
      label: T1 — Translations & Adaptations / ཡིག་སྒྱུར་དང་བསྒྱུར་བཅོས།
      options:
        - label: "Retelling the text for a new audience — ཀློག་པ་པོ་གསར་པའི་ཆེད་དུ་སླར་བརྗོད།"

  - type: checkboxes
    id: t2-plans
    attributes:
      label: T2 — Plans / འཆར་གཞི།
      options:
        - label: "Practice plans — ཉམས་ལེན་འཆར་གཞི།"
        - label: "Learning plans — སྦྱོང་བརྡར་འཆར་གཞི།"

  - type: checkboxes
    id: t3-courses
    attributes:
      label: T3 — Courses / སློབ་ཚན།
      options:
        - label: "Curriculum and course materials — སློབ་ཚན་དང་སློབ་ཡིག"

  - type: markdown
    attributes:
      value: "---"

  - type: textarea
    id: description
    attributes:
      label: ལས་ཀའི་འགྲེལ་བཤད། / Description
      description: ལས་ཀ་འདིའི་ནང་དོན་དང་དམིགས་ཡུལ། / What this task involves and its goal
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: འགན་འཁུར་བ། / Assignee
      description: GitHub username
      placeholder: "@username"

  - type: textarea
    id: audio-links
    attributes:
      label: སྒྲའི་དྲ་བྱང་། / Audio links
      description: སྒྲའི་ཡིག་ཆ་དང་དྲ་ཐག (S1) / Audio files and links (S1)
      placeholder: |
        https://...
        https://...

  - type: textarea
    id: video-links
    attributes:
      label: བརྙན་གྱི་དྲ་བྱང་། / Video links
      description: བརྙན་གྱི་ཡིག་ཆ་དང་དྲ་ཐག (S1) / Video files and links (S1)
      placeholder: |
        https://...
        https://...

  - type: textarea
    id: links
    attributes:
      label: འབྲེལ་ཡོད་ཡིག་ཆ་དང་དྲ་བྱང་གཞན། / Other related files & links
      description: དགོས་ན། ཡིག་ཆ། དྲ་ཐག ཡང་ན་ issue གཞན། / Optional docs, links, or related issues
